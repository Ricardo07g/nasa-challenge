# ==============================================================================
# Regras do motor de pontuação (Raiz Orbital), versão 0
# Referência: PRD seção 7 e plano técnico §4. Editável pela agrônoma sem mexer no código.
#
# Cada número tem `valor` e `fonte`. A API não carrega um número sem fonte.
# "Hipótese do time" = valor a calibrar com a agrônoma e com os resultados reais.
# Tarefa 0066 (revisão com fontes): os números conferidos citam a fonte em forma curta (autores, ano,
# revista ou portaria, DOI ou link); os que não acharam fonte começam com "Hipótese do time".
# Revisão completa: docs/tarefas/0066-regras-com-fonte.md.
# Os parâmetros de cada cultura (ciclo, Kc, data limite, nota de solo) ficam em culturas.yaml.
# Nenhum número em reais: a renda é só fatos (grupo `renda`, tarefa 0040).
# ==============================================================================

clima:
  # Ano com aperto (PRD 7.2): ISNA abaixo do limiar na janela crítica OU calor na janela.
  isna_grao:
    valor: 0.55
    fonte: "ZARC milho 2ª safra MG, Portaria SPA/MAPA nº 324, de 28/07/2026, item 1.14.a: ISNA 0,55 na fase III (floração e enchimento); o mesmo da soja em MG (Portaria SPA/MAPA nº 200/2026). https://www.in.gov.br/web/dou/-/portaria-spa/mapa-n-324-de-28-de-julho-de-2026-722143549"
  isna_cobertura:
    valor: 0.50
    fonte: "Hipótese do time: não há ZARC de plantas de cobertura; vale para a crotalária (o milheto tem o ISNA do ZARC dele em isna_por_cultura)"
  isna_por_cultura:
    valor: {milho_braquiaria: 0.50, sorgo: 0.45, milheto: 0.60}
    fonte: "ZARC de MG: consórcio milho-braquiária 0,50 na fase III (Portaria SPA/MAPA nº 339/2026, item 1.17.a); sorgo granífero 0,45 na fase III (Portaria SPA/MAPA nº 275/2026, item 1.8.4); milheto 0,60 na fase I, estabelecimento (Portaria SPA/MAPA nº 345/2020, item IV). As outras culturas ficam com isna_grao ou isna_cobertura"
  janela_grao_meia_dias:
    valor: 15
    fonte: "Andrade et al. (1999), Crop Science 39(2):453-459, doi:10.2135/cropsci1999.0011183X0039000200026x: o período crítico do milho são os 31 dias em volta do embonecamento"
  janela_cobertura_dias:
    valor: 30
    fonte: "Hipótese do time: nenhuma fonte para 30 dias; o ZARC do milho 2ª safra usa 20 dias na fase I, estabelecimento (Portaria SPA/MAPA nº 324/2026, item 1.12)"
  calor_temp_c:
    valor: 35.0
    fonte: "Hatfield & Prueger (2015), Weather and Climate Extremes 10:4-10, doi:10.1016/j.wace.2015.08.001: a viabilidade do pólen do milho cai acima de 35 °C (no sorgo, a partir de 33 °C)"
  calor_min_dias:
    valor: 3
    fonte: "Hipótese do time: sem número na literatura; a floração do milho dura 3 a 5 dias (Hatfield & Prueger, 2015)"
  # A perda de produtividade pelo ISNA (0%, 30% e 60%) só servia à margem em reais e saiu com ela
  # (tarefa 0040).

nota_final:
  # Nota final = soma de (peso x nota). Sem CMIP6, o futuro sai e os outros pesos são reescalados.
  peso_seguranca:
    valor: 0.30
    fonte: "Hipótese do time (PRD 7.6 e RF-05; plano técnico §4.5: pesos padrão 30/25/30/15): os pesos são escolha de quem decide, sem fonte agronômica"
  peso_solo:
    valor: 0.25
    fonte: "Hipótese do time (PRD 7.6 e RF-05; plano técnico §4.5: pesos padrão 30/25/30/15)"
  peso_renda:
    valor: 0.30
    fonte: "Hipótese do time (PRD 7.6 e RF-05; plano técnico §4.5: pesos padrão 30/25/30/15)"
  peso_futuro:
    valor: 0.15
    fonte: "Hipótese do time (PRD 7.6 e RF-05; plano técnico §4.5: pesos padrão 30/25/30/15)"
  bonus_gado_milho_braquiaria:
    valor: 15.0
    fonte: "ADR-0004: com gado = sim, milho + braquiária ganha 15 pontos (pecuária ainda em decisão, R4.7)"

rotulos:
  # Rótulos que o produtor vê (PRD 7.6, plano técnico §4.4; hipótese do time)
  chuva_bom_pct:
    valor: 85.0
    fonte: "PRD 7.6: chuva Bom com 17 a 20 anos sem aperto (17 de 20 = 85%)"
  chuva_medio_pct:
    valor: 60.0
    fonte: "PRD 7.6: chuva Médio com 12 a 16 anos sem aperto (12 de 20 = 60%)"
  terra_bom:
    valor: 50.0
    fonte: "PRD 7.6: terra Bom com nota de solo 50 ou mais"
  terra_medio:
    valor: 20.0
    fonte: "PRD 7.6: terra Médio com nota de solo de 20 a 49"
  renda_bom:
    valor: 70.0
    fonte: "PRD 7.6: renda Bom com nota de renda 70 ou mais (antes 'dinheiro'; tarefa 0040)"
  renda_medio:
    valor: 30.0
    fonte: "PRD 7.6: renda Médio com nota de renda de 30 a 69 (antes 'dinheiro'; tarefa 0040)"

renda:
  # Nota de renda sem preço nem custo (PRD 7.5, tarefa 0040; seção 1 da remodelagem: nenhum valor em
  # reais). Quem dá grão para vender tem a renda que o clima deixa colher: nota = segurança climática
  # da própria opção (anos sem aperto / anos simulados x 100; no cenário seco, só os anos secos).
  # Quem não dá grão (cobertura, pousio) fica com a nota fixa abaixo. A nota final continua com os
  # mesmos eixos e pesos (grupo nota_final).
  tipos_com_grao:
    valor: [grao, consorcio]
    fonte: "PRD 5 (coluna Função: milho safrinha e sorgo são grão; milho + braquiária é grão + cobertura) e o `tipo` do culturas.yaml. Hipótese do time, a revisar"
  nota_sem_grao:
    valor: 0.0
    fonte: "PRD 5 (coluna Renda: 0 para pousio, milheto e crotalária, que não dão grão). Hipótese do time, a revisar: a cobertura é investimento na terra e ganha no eixo do solo, não no da renda"

solo:
  # Nota de solo (PRD 7.4): palhada + nitrogênio + quebra de pragas; os pontos por cultura ficam
  # em culturas.yaml (nota_solo).
  palhada_max:
    valor: 40.0
    fonte: "PRD 7.4: palhada vale até 40 pontos"
  nitrogenio_max:
    valor: 30.0
    fonte: "PRD 7.4: nitrogênio vale até 30 pontos"
  pragas_max:
    valor: 30.0
    fonte: "PRD 7.4: quebra de pragas vale até 30 pontos"
  peso_pragas_nematoide:
    valor: 1.5
    fonte: "PRD 7.4: com nematoide = sim, a coluna de pragas vale 1,5 vez e o total é reescalado para 0 a 100"

ndvi:
  # Colheita sugerida pela série de NDVI do MODIS, já com o fator 0,0001 (PRD 7.9).
  # Os limites do histórico do talhão (PRD 7.8) ficam em historico_ndvi.
  queda_colheita:
    valor: 0.50
    fonte: "Hipótese do time (PRD 7.9): soja secando quando o NDVI cai abaixo de 50% do pico do verão. A literatura usa fração da amplitude (pico menos base), escolhida pelo usuário (Eklundh & Jönsson, 2017, TIMESAT 3.3 Manual, §4.3); a colheita fica perto de 90% da queda (Carneiro de Santana et al., 2024, Remote Sensing 16:2520)"

colheita:
  # Tela 3 "Quando você colhe a soja?" (tarefa 0042). A data exata vira uma das três faixas do motor
  # (cedo, meio, tarde); a faixa sugerida pelo NDVI (PRD 7.9) usa a mesma regra, para a sugestão e a
  # seleção serem sempre a mesma. Datas "MM-DD", inclusivas.
  cedo_ate:
    valor: "02-10"
    fonte: "Regra que a tela 3 já usava para a data exata (harvestService.harvestFromDate) e os rótulos das faixas ('até dia 10'); janeiro também conta como cedo"
  meio_ate:
    valor: "02-20"
    fonte: "Regra que a tela 3 já usava para a data exata e os rótulos das faixas ('dia 11 a 20', 'depois do dia 20'). Tarefa 0042: a faixa sugerida pelo NDVI usava até 22/fev (dia 53, app/constants.py) e passou a usar esta, para a sugestão e a seleção serem a mesma"
  janela_inicio:
    valor: "01-15"
    fonte: "Época da colheita da soja na tela 3 (harvestService.harvestWindow, de 15/jan a 31/mar; a decisão acontece de dezembro a março, PRD §3). Primeiro dia da tabela da chuva que sobra"
  janela_fim:
    valor: "03-31"
    fonte: "Época da colheita da soja na tela 3 (harvestService.harvestWindow). Último dia da tabela da chuva que sobra"

chuva_que_sobra:
  # "Chuva que sobra depois da colheita" (tela 3, tarefa 0042): para cada dia de colheita da época, a
  # chuva somada do dia até `fim` em cada ano da célula (GPM IMERG; nos anos sem IMERG, NASA POWER), a
  # mediana dos anos e o ano seco (percentil, com interpolação linear entre os anos ordenados).
  fim:
    valor: "06-30"
    fonte: "Pedido da remodelagem, seção 3 ('da data escolhida até junho'): até 30 de junho, inclusive"
  percentil_seco:
    valor: 20
    fonte: "Convenção do ZARC: níveis de risco de 20%, 30% e 40% (Portaria SPA/MAPA nº 324/2026, item 1.6); Sans et al. (2001), Rev. Bras. Agrometeorologia 9(3):527-535, usam o ISNA de 80% dos anos. Ano seco = 1 em cada 5 anos teve menos chuva (pedido da remodelagem, seção 3)"

fim_das_chuvas:
  # Fim das chuvas na célula (tela 3, tarefa 0042; o raio-X da seção 4 usa o mesmo): em cada ano, o
  # primeiro dia, a partir de `inicio`, que começa `dias` dias seguidos com menos de `chuva_max_mm` mm
  # SOMADOS (não por dia). Ano sem nenhum dia assim dentro da série (até 31/jul): sem resultado.
  inicio:
    valor: "03-01"
    fonte: "Pedido da remodelagem, seção 3 ('primeiro dia, a partir de 1º de março'). Hipótese do time, a revisar"
  dias:
    valor: 20
    fonte: "Pedido da remodelagem, seção 3 ('20 dias seguidos'). Hipótese do time, a revisar"
  chuva_max_mm:
    valor: 10.0
    fonte: "Pedido da remodelagem, seção 3 ('com menos de 10 mm'), lido como a soma dos 20 dias: 10 mm por dia seria quase todo dia de chuva (decisão da tarefa 0042). Hipótese do time, a revisar"

raio_x:
  # Raio-X da sua terra (tela 4 "O que o satélite viu", remodelagem S4, tarefa 0043). Datas "MM-DD",
  # inclusivas, na série guardada da célula (chuva do GPM IMERG; temperatura e ETo do NASA POWER).
  # O dia seco é o dos avisos (avisos.dia_seco_abaixo_mm), o calor é o do motor (clima.calor_temp_c),
  # a janela em volta da floração é a do aperto (clima.janela_grao_meia_dias) e o fim das chuvas é o
  # do grupo fim_das_chuvas: não se repetem aqui.
  chuva_inicio:
    valor: "01-01"
    fonte: "Pedido da remodelagem, seção 4 ('total médio de janeiro a julho'): toda a temporada guardada (1/jan a 31/jul)"
  chuva_fim:
    valor: "07-31"
    fonte: "Pedido da remodelagem, seção 4 ('total médio de janeiro a julho')"
  veranico_inicio:
    valor: "03-01"
    fonte: "Pedido da remodelagem, seção 4 ('maior sequência de dias com menos de 1 mm entre março e maio'): o outono da safrinha"
  veranico_fim:
    valor: "05-31"
    fonte: "Pedido da remodelagem, seção 4 ('entre março e maio')"
  calor_inicio:
    valor: "03-01"
    fonte: "Pedido da remodelagem, seção 4 ('dia de 35 °C ou mais entre março e maio'), quando a safrinha floresce"
  calor_fim:
    valor: "05-31"
    fonte: "Pedido da remodelagem, seção 4 ('entre março e maio')"
  regiao_inicio:
    valor: "03-01"
    fonte: "Pedido da remodelagem, seção 4 ('posição da célula entre as 225 da caixa em chuva de março a maio')"
  regiao_fim:
    valor: "05-31"
    fonte: "Pedido da remodelagem, seção 4 ('chuva de março a maio')"
  regiao_min_celulas:
    valor: 10
    fonte: "Hipótese do time, a revisar: com menos de 10 células com a mesma fonte de chuva, a comparação com a região não diz nada e o bloco não aparece (a caixa piloto tem 225)"
  solo_vizinho_max_km:
    valor: 15.0
    fonte: "Hipótese do time, a revisar: ponto em célula sem solo do SoilGrids usa o ponto gravado mais perto, só até 15 km (pouco mais que uma célula de 0,1° na diagonal), e o bloco diz que é da vizinha (pedido da remodelagem, seção 4)"
  ndvi_inicio:
    valor: "01-01"
    fonte: "Pedido da remodelagem, seção 4 ('cada coluna é uma leitura de 16 dias de janeiro a julho'): a série guardada do NDVI vai de janeiro a julho (contrato do NDVI)"
  ndvi_fim:
    valor: "07-31"
    fonte: "Pedido da remodelagem, seção 4 ('de janeiro a julho')"
  ndvi_coluna_dias:
    valor: 16
    fonte: "MODIS MOD13Q1/MYD13Q1: composição de 16 dias (Terra nos dias 1, 17, 33...; Aqua 8 dias depois). Cada coluna junta as duas e fica com o maior NDVI bom"
  futuro_mes_inicio:
    valor: 3
    fonte: "Pedido da remodelagem, seção 4 ('variação da chuva de março a maio em %, da máxima em °C'): primeiro mês"
  futuro_mes_fim:
    valor: 5
    fonte: "Pedido da remodelagem, seção 4 ('de março a maio'): último mês"

alertas_area:
  # Alertas da sua área (tela 4, tarefa 0043): cada um só aparece se o dado indicar risco. Geada e
  # calor pelo NASA POWER, chuva forte pelo GPM IMERG, fogo pelo MODIS MCD64A1 (área queimada, pela
  # ORNL DAAC). NÃO há alerta de granizo: nenhuma fonte que o app usa mede granizo.
  geada_temp_c:
    valor: 3.0
    fonte: "Wrege et al. (2018), Revista Brasileira de Climatologia 22:524-553: mínima no abrigo abaixo de 3 °C é a referência de geada no chão (Grodzki et al., 1996). O ZARC do milho 2ª safra de MG usa mínimas menores que 2 °C no abrigo (Portaria SPA/MAPA nº 324/2026, item 1.14.c). A mínima é a do ar a 2 m na célula do NASA POWER (~50 km), que suaviza as baixadas frias"
  geada_inicio:
    valor: "05-01"
    fonte: "Pedido da remodelagem, seção 4 ('entre maio e julho')"
  geada_fim:
    valor: "07-31"
    fonte: "Pedido da remodelagem, seção 4 ('entre maio e julho'): o fim da temporada guardada"
  geada_anos_min:
    valor: 1
    fonte: "Hipótese do time, a revisar: um ano com geada na série já é risco e o alerta aparece; sem nenhum, não aparece"
  chuva_forte_mm:
    valor: 50.0
    fonte: "INMET, avisos de Chuvas Intensas: 'Perigo' com 50 a 100 mm/dia (feed oficial de avisos, lido em 15/11/2026). A erosão começa com chuvas bem menores (Wischmeier & Smith, 1978, USDA Agriculture Handbook 537: chuva abaixo de 12,7 mm só conta com intensidade alta)"
  chuva_forte_inicio:
    valor: "02-01"
    fonte: "Pedido da remodelagem, seção 4 ('em fevereiro e março'): logo depois da colheita da soja, com a terra descoberta"
  chuva_forte_fim:
    valor: "03-31"
    fonte: "Pedido da remodelagem, seção 4 ('em fevereiro e março')"
  chuva_forte_media_min_dias:
    valor: 0.1
    fonte: "Hipótese do time, a revisar: o alerta aparece com média de 0,1 dia por ano ou mais (2 dias assim em 20 anos); com menos, a chuva forte é rara demais para ser risco da área"
  fogo_raio_km:
    valor: 5.0
    fonte: "Hipótese do time: nenhuma fonte diz a que distância uma queimada vira risco para a palhada. Fogo a até 5 km do ponto (pixels de 500 m do MCD64A1, Giglio et al., 2018, Remote Sensing of Environment 217:72-85, com o centro dentro do raio)"
  fogo_anos_min:
    valor: 1
    fonte: "Hipótese do time, a revisar: um ano com fogo perto já é risco e o alerta aparece"
  fogo_ano_inicio:
    valor: 2016
    fonte: "Pedido da remodelagem, seção 4 ('baixe para a caixa piloto, 2016–2025'): primeiro ano do MCD64A1"
  fogo_ano_fim:
    valor: 2025
    fonte: "Pedido da remodelagem, seção 4 ('2016–2025'): último ano completo do MCD64A1"

historico_ndvi:
  # Histórico do talhão pelo NDVI do MODIS (PRD 7.8 e guia do histórico NDVI, "Regra do talhão").
  # Por ano: observações boas (qualidade 0 ou 1) da janela; menos de `min_observacoes` = sem_dado;
  # maior NDVI acima de `limite_plantou` = plantou; abaixo de `limite_parado` = parado; senão incerto.
  janela_inicio:
    valor: "04-01"
    fonte: "PRD 7.8 e guia do histórico NDVI: entressafra de 1º de abril a 31 de julho (a soja do Triângulo é colhida em fevereiro e março)"
  janela_fim:
    valor: "07-31"
    fonte: "PRD 7.8 e guia do histórico NDVI: entressafra de 1º de abril a 31 de julho"
  limite_plantou:
    valor: 0.60
    fonte: "Hipótese do time (PRD 7.8: maior NDVI da entressafra acima de 0,6 = segunda safra ou cobertura; a calibrar com talhões da região). A referência 'Embrapa, 2021' não foi encontrada; os números 0,6 e 0,45 de Spera et al. (2014), Environ. Res. Lett. 9:064010, são de EVI e com outro sentido"
  limite_parado:
    valor: 0.45
    fonte: "Hipótese do time (PRD 7.8: maior NDVI da entressafra abaixo de 0,45 = pousio; a calibrar com talhões da região). Em Mato Grosso o pousio rebrota verde (Chen et al., 2018, Int. J. Appl. Earth Obs. Geoinf. 69:133-147)"
  min_observacoes:
    valor: 3
    fonte: "Guia do histórico NDVI (Regra do talhão): com menos de 3 observações boas na janela, o ano fica sem_dado (hipótese do time, a calibrar)"
  ano_inicio:
    valor: 2017
    fonte: "Decisão de 15/11/2026: entressafras de 2017 a 2026, mantendo 10 anos (antes, 2016 a 2025, pelo roteiro §5, R3.2)"
  ano_fim:
    valor: 2026
    fonte: "Decisão de 15/11/2026: a entressafra de 2026 (abril a julho) já aconteceu e entra no histórico; 10 anos, de 2017 a 2026"
  anos_confirmaveis:
    valor: 3
    fonte: "Decisão de 15/11/2026: o produtor confirma o que plantou depois da soja nas 3 últimas entressafras (2024, 2025 e 2026), e a resposta dele vale no lugar do satélite naquele ano"

regiao_ndvi:
  # Região pelo satélite (P3, RF-23, tarefa 0036): dentro da máscara de lavoura (MCD12Q1 classe 12)
  # de cada ano, um pixel só é "soja daquele ano" se mostrar a soja E a colheita. Pixel sem pico ou
  # sem colheita (cana, café, pasto, solo exposto) fica fora dos percentuais. Os pixels que passam são
  # classificados pela regra do talhão (historico_ndvi: qualidade 0/1, mínimo de observações, limites),
  # só com as observações depois da colheita até entressafra_fim. Datas "MM-DD"; NDVI de -1 a 1.
  pico_inicio:
    valor: "01-01"
    fonte: "Hipótese do time; substitui a máscara de soja do MapBiomas do guia NDVI. A revisão (tarefa 0066) indica começar em 1º/dez: no Triângulo o pico pode cair em dezembro (Oliveira et al., 2016, Ciência Rural 46(9):1683-1688: 0,93 em 19/dez, em Planura, MG). Fica em 1º/jan até baixar o NDVI de dezembro (a série guardada começa em janeiro)"
  pico_fim:
    valor: "03-15"
    fonte: "Risso et al. (2012), PAB 47(9):1317-1326, doi:10.1590/S0100-204X2012000900017: a janela do pico da soja 'não deve ir além de meados de março'"
  pico_min_ndvi:
    valor: 0.70
    fonte: "Risso et al. (2012), PAB 47(9):1317-1326: no pico, a soja em bom estado passa de 0,85 de NDVI; 0,70 é conservador. Sozinho não separa soja de pasto: vale junto com a colheita"
  colheita_fim:
    valor: "05-15"
    fonte: "Conab, Progresso de safra 2025/26: soja de MG 98% colhida até 25/04 e 100% até 08/05 (média de 5 anos: 99,95% até 08/05)"
  colheita_max_ndvi:
    valor: 0.40
    fonte: "Oliveira et al. (2016), Ciência Rural 46(9):1683-1688: 0,25 na colheita (Planura, MG); Carneiro de Santana et al. (2024), Remote Sensing 16:2520: fim do ciclo perto de 0,37. Na dupla safra, parte dos pixels não registra a queda no composto de 16 dias"
  entressafra_fim:
    valor: "07-31"
    fonte: "Hipótese do time, a revisar pela agrônoma; substitui a máscara de soja do MapBiomas do guia NDVI. Fim da entressafra (o mesmo do historico_ndvi.janela_fim do talhão)"

soja_recente:
  # Soja na safra mais recente no ponto marcado (RF-24, tarefa 0037): no começo do fluxo, o app
  # confere se o satélite viu soja no pixel de 250 m do MODIS, para saber que o ponto é lavoura (e
  # não cidade, cana ou pasto). Pixel: maior NDVI das observações boas (qualidade 0 ou 1, MOD13Q1 e
  # MYD13Q1) da janela; menos de `min_observacoes` = sem dado (nenhum aviso). O
  # pipeline/fetch_soja_recente.py usa a janela e o mínimo ao gravar o pico de cada pixel; a API
  # compara o pico com `ndvi_minimo`.
  # INTEGRAÇÃO: o `ndvi_minimo` e a janela são os mesmos números do pico da soja da região
  # calibrada (tarefa 0036: `regiao_ndvi.pico_min_ndvi`, `pico_inicio` e `pico_fim`). Os dois grupos
  # devem virar um só.
  janela_inicio:
    valor: "01-01"
    fonte: "Hipótese do time, a revisar pela agrônoma (decisão do usuário de 15/11/2026): a soja do Triângulo fica verde em janeiro e é colhida em fevereiro e março"
  janela_fim:
    valor: "03-15"
    fonte: "Hipótese do time, a revisar pela agrônoma (decisão do usuário de 15/11/2026): janela de 1º de janeiro a 15 de março"
  ndvi_minimo:
    valor: 0.70
    fonte: "Risso et al. (2012), PAB 47(9):1317-1326: no pico, a soja passa de 0,85 de NDVI; 0,70 é conservador. O mesmo limite do pico da soja da região (regiao_ndvi.pico_min_ndvi, tarefa 0036; decisão do usuário de 15/11/2026)"
  min_observacoes:
    valor: 2
    fonte: "Hipótese do time, a revisar pela agrônoma (decisão do usuário de 15/11/2026): com menos de 2 observações boas na janela (verão com nuvem), o pixel fica sem dado e o app não avisa"

rotacao:
  # Plano de 3 anos (PRD 7.7)
  anos_secos:
    valor: 4
    fonte: "PRD 7.7 e plano técnico §4.6: cenário ano seco com os 4 anos mais secos da série"
  meses_seco:
    valor: [2, 3, 4]
    fonte: "PRD 7.7: ano seco = menor chuva de fevereiro a abril"
  max_pousios:
    valor: 2
    fonte: "Hipótese do time (PRD 7.7: descartar mais de 2 pousios seguidos; o pousio entra nas 216 combinações). Nenhuma fonte dá o número; a terra descoberta perde mais água e terra (Dechen et al., 2015, Bragantia 74(2):224-233)"
  bonus_diversidade_2:
    valor: 5.0
    fonte: "Hipótese do time (PRD 7.7: +5 com 2 funções diferentes). A direção tem fonte: rotação com mais culturas aumenta o C e o N do solo, mais ainda com cobertura (McDaniel et al., 2014, Ecological Applications 24(3):560-570); o número, não"
  bonus_diversidade_3:
    valor: 10.0
    fonte: "Hipótese do time (PRD 7.7: +10 com 3 funções diferentes: grão, cobertura gramínea, cobertura leguminosa). Direção como no bonus_diversidade_2 (McDaniel et al., 2014); o número, não"
  # A penalidade de 12 pontos para milho safrinha nos 3 anos saiu no R4.3 (tarefa 0016): não está no
  # PRD 7.7, e o bônus por função já deixa o milho repetido sem os +5/+10.
  culturas_supressoras_nematoide:
    valor: [crotalaria]
    fonte: "Debiasi et al. (2016), PAB 51(10):1720-1728, doi:10.1590/S0100-204X2016001000003: no campo, as crotalárias reduziram Pratylenchus brachyurus antes e no começo da soja; o milheto sozinho, o milho e as braquiárias não diferiram da testemunha. A C. spectabilis também reduz M. javanica e M. incognita (Dias et al., 2010, Embrapa Soja, Circular Técnica 76). PRD 7.7: com nematoide = sim, descartar 3 anos sem supressora (só quando uma cabe na janela)"
  funcoes:
    # O bônus de diversidade conta as funções diferentes do plano, não as culturas.
    valor:
      pousio: []
      milho_safrinha: [grao]
      sorgo: [grao]
      milho_braquiaria: [grao, cobertura_graminea]
      milheto: [cobertura_graminea]
      crotalaria: [cobertura_leguminosa]
    fonte: "PRD 5 (coluna Função) e 7.7 (grão, cobertura gramínea, cobertura leguminosa). Milho + braquiária conta grão e cobertura gramínea, porque o PRD 5 diz 'Grão + cobertura' e a braquiária é gramínea (hipótese do time, revisar com a agrônoma)"

sinal_outono:
  # Sinal para o outono e regra do dia de plantar (PRD 7.10, RF-20; plano de evolução, ajuste A2).
  # Hipótese a calibrar com as previsões retrospectivas do GMAO antes de publicar (tarefa A2.5).
  chance_seco_min:
    valor: 0.50
    fonte: "PRD 7.10: sinal de seco com chance de chuva abaixo do normal em março a maio de 50% ou mais (GEOS-S2S; hipótese a calibrar)"
  chance_normal_max:
    valor: 0.33
    fonte: "PRD 7.10: sinal de normal com chance de chuva abaixo do normal menor que 33% e terra sem falta de água (hipótese a calibrar)"
  smap_percentil_seco:
    valor: 20.0
    fonte: "PRD 7.10: terra seca com o SMAP sm_rootzone_pctl abaixo do percentil 20 (e a chuva recente baixa)"
  chuva_fracao_seco:
    valor: 0.60
    fonte: "PRD 7.10: terra seca com a chuva dos últimos 30 dias pelo IMERG abaixo de 60% da média (e o SMAP baixo)"
  # Tarefa 0038 (decisão de 15/11/2026): o sinal agora vem da previsão do El Niño / La Niña (grupo
  # sinal_enso, abaixo). O GEOS-S2S e o IMERG Late saíram do sinal: chance_seco_min e
  # chance_normal_max ficam sem uso. O smap_percentil_seco é a 1ª faixa do SMAP de agora. O
  # chuva_fracao_seco era o X da regra da data, que saiu na S9 da remodelagem (tarefa 0049): fica
  # sem uso, como o texto do PRD 7.10.

sinal_enso:
  # Sinal para o outono pela previsão do ENSO da NOAA CPC + o histórico da opção do 1º ano do Plano A
  # nos anos daquela fase (ONI de cada ano, grupo enso). Tarefa 0038; hipótese do time, a revisar.
  estacao_previsao:
    valor: FMA
    fonte: "Hipótese do time, a revisar (tarefa 0038): fevereiro a abril, da semeadura à floração da safrinha. É a última estação da média do ONI dos anos da série (grupo enso: DJF, JFM e FMA), então a fase prevista e a dos anos passados medem a mesma época; e é prevista com 1 mês a menos de antecedência que MAM (mais acerto, antes da barreira de previsibilidade do outono)"
  fase_chance_min_pct:
    valor: 50
    fonte: "Hipótese do time (tarefa 0038): a fase mais provável precisa de 50% ou mais (mais provável que as outras duas juntas). A NOAA CPC não define limiar numérico (ENSO Alert System); nas discussões mensais ela diz 'likely' a partir de ~55%"
  anos_fase_min:
    valor: 5
    fonte: "Hipótese do time (tarefa 0038): pelo menos 5 anos daquela fase na série (2005 a 2024). Ropelewski & Halpert (1987), Monthly Weather Review 115:1606-1626, só compõem estações com 5 episódios ou mais (mínimo de cálculo, não de significância)"
  fracao_anos_ruins_seco:
    valor: 0.5
    fonte: "Hipótese do time (tarefa 0038): sinal de seco (Plano B) quando a opção do 1º ano do Plano A deu errado (aperto do motor, PRD 7.2) em metade ou mais dos anos daquela fase, e a do Plano B se saiu melhor neles. Desde a tarefa 0066 vale junto com o p_max_seco (pior que nos outros anos)"
  p_max_seco:
    valor: 0.10
    fonte: "Tarefa 0066: com 5 anos da fase em 20, a regra da metade sozinha dispara por acaso de 13% a 50% das vezes (distribuição hipergeométrica). Por isso o seco também pede que a fase tenha mais anos ruins que os outros anos, com o teste exato de Fisher unilateral (hipergeométrico) com p de até 0,10, o nível usado por Iizumi et al. (2014), Nature Communications 5:3712, para o efeito do ENSO nas safras"
  smap_faixas_pct:
    valor: [20.0, 45.0, 55.0, 80.0]
    fonte: "Hipótese do time, a revisar (tarefa 0038): percentis do SMAP de agora que separam 5 faixas (mais seca, um pouco mais seca, perto do normal, um pouco mais úmida, mais úmida que o normal). O 20 é o da terra seca do PRD 7.10. Só informa: o SMAP não decide o plano"

avisos:
  # Avisos da safra: replay de uma safra passada (P4) e acompanhamento diário (P6), plano de
  # evolução 4.4. A janela crítica e a temperatura do calor são as do grupo clima (mesma conta do
  # aperto). Um aviso de veranico por sequência seca e um de calor por sequência quente.
  dia_seco_abaixo_mm:
    valor: 1.0
    fonte: "Hipótese do time, a revisar com a agrônoma: dia seco = chuva abaixo de 1 mm, como o índice CDD do ETCCDI (OMM). O plano de evolução 4.4 não define o dia seco do aviso; com os 5 mm do P1 (4.1), a fazenda de exemplo teria aviso de veranico em 19 de 20 anos; com 1 mm, em 11, incluindo os 7 anos com aperto do motor"
  veranico_min_dias:
    valor: 10
    fonte: "Plano de evolução 4.4 (regras do Doc 5, no PRD): 10 ou mais dias secos na fase crítica"
  calor_dias_seguidos:
    valor: 2
    fonte: "Plano de evolução 4.4 (regras do Doc 5, no PRD): 2 dias seguidos com máxima de 35 °C ou mais"
  max_avisos:
    valor: 2
    fonte: "Plano de evolução 4.4: no máximo 2 avisos por semana por talhão, para não virar ruído"
  janela_limite_dias:
    valor: 7
    fonte: "Plano de evolução 4.4: a semana do limite de avisos; hipótese do time: 7 dias corridos que terminam no dia do aviso (a revisar)"

avisos_tela:
  # Tela "Avisos" (/avisos, remodelagem S6, tarefa 0046). Grupo à parte do `avisos` (replay P4 e
  # acompanhamento P6), que continua igual. Reaproveita sem repetir: o dia seco
  # (avisos.dia_seco_abaixo_mm), o calor (clima.calor_temp_c), o raio da comunidade
  # (comunidade.raio_km), a estação e a chance mínima da previsão do ENSO (sinal_enso) e as janelas
  # de março a maio do veranico e do calor (raio_x). Terra seca pelo SMAP; dias sem chuva e calor
  # pelo NASA POWER dos últimos dias; mudanças e recordes na série guardada da célula (chuva do GPM
  # IMERG; temperatura do NASA POWER).
  terra_seca_percentil_max:
    valor: 20.0
    fonte: "Pedido da remodelagem, seção 6 ('percentil do SMAP de 20 ou menos'); é também o percentil da terra seca do PRD 7.10 (sinal_outono.smap_percentil_seco)"
  smap_antiga_dias:
    valor: 15
    fonte: "Pedido da remodelagem, seção 6 ('leitura com mais de 15 dias é marcada como antiga')"
  power_dias:
    valor: 30
    fonte: "Pedido da remodelagem, seção 6 ('os últimos 30 dias da célula' na API do NASA POWER)"
  dias_sem_chuva_min:
    valor: 10
    fonte: "Pedido da remodelagem, seção 6 ('10 ou mais dias seguidos com menos de 1 mm até a última leitura'); são os 10 dias do veranico do plano de evolução 4.4 (avisos.veranico_min_dias)"
  calor_dias_min:
    valor: 3
    fonte: "Pedido da remodelagem, seção 6 ('3 ou mais dias de 35 °C nos últimos 10'); são os 3 dias do calor do motor (clima.calor_min_dias)"
  calor_janela_dias:
    valor: 10
    fonte: "Pedido da remodelagem, seção 6 ('nos últimos 10' dias até a última leitura)"
  vizinhos_dias:
    valor: 7
    fonte: "Pedido da remodelagem, seção 6 ('eventos relatados pela comunidade nos últimos 7 dias'): hoje e os 6 dias antes, no dia de Uberlândia, como o resumo de chuva da comunidade (decisão D52)"
  ano_recente_inicio:
    valor: 2020
    fonte: "Pedido da remodelagem, seção 6 ('compare 2020–2024 com 2005–2019'): os anos a partir deste são os recentes; os de antes, a referência"
  outono_inicio:
    valor: "03-01"
    fonte: "Pedido da remodelagem, seção 6 ('outono mais seco'): março a maio, a mesma época do veranico e do calor do raio-X (seção 4)"
  outono_fim:
    valor: "05-31"
    fonte: "Pedido da remodelagem, seção 6 ('outono mais seco'): até 31 de maio"
  mudou_veranico_dias_min:
    valor: 5.0
    fonte: "Hipótese do time, a revisar: a média do maior veranico de março a maio de cada ano só aparece como mudança com 5 dias ou mais de diferença entre 2020–2024 e 2005–2019 (metade do veranico do aviso, 10 dias)"
  mudou_fim_chuvas_dias_min:
    valor: 10
    fonte: "Hipótese do time, a revisar: a mediana do fim das chuvas só aparece como mudança com 10 dias ou mais de diferença (o fim das chuvas na lavoura de demonstração varia de 16/mar a 22/jun nos 20 anos)"
  mudou_calor_dias_min:
    valor: 1.0
    fonte: "Hipótese do time, a revisar: a média de dias com 35 °C ou mais de março a maio por ano só aparece como mudança com 1 dia por ano ou mais de diferença"
  mudou_falta_agua_mm_min:
    valor: 25.0
    fonte: "Hipótese do time, a revisar: a média da falta de água no ciclo da melhor opção (ETc menos ETr do balanço do motor) só aparece como mudança com 25 mm ou mais de diferença (a CAD da terra argilosa é 60 mm)"
  mudou_deu_certo_pct_min:
    valor: 25.0
    fonte: "Hipótese do time, a revisar: a parte dos anos em que a melhor opção deu certo só aparece como mudança com 25 pontos percentuais ou mais de diferença (com 5 anos recentes, cada ano vale 20 pontos: um ano só não basta)"

enso:
  # Marca de El Niño / La Niña de cada safrinha no detalhe dos anos (P1, plano de evolução 4.1).
  # Só informa: não entra na conta. É dado da NOAA, não da NASA. O pipeline/fetch_oni.py usa estes
  # números ao gravar a fase de cada ano no arquivo do ONI (ONI_PATH); a API lê a fase pronta.
  el_nino_oni_min:
    valor: 0.5
    fonte: "NOAA CPC: El Niño com o índice de +0,5 °C ou mais. Desde 01/02/2026 o índice oficial é o RONI (Relative ONI), com os mesmos ±0,5 °C (NWS Public Information Statement 26-05, https://www.weather.gov/media/notification/pdf_2026/pns26-05_Relative_ONI.pdf); o pipeline/fetch_oni.py baixa o RONI. A NOAA pede 5 estações seguidas para chamar de episódio; aqui vale a média das estações abaixo"
  la_nina_oni_max:
    valor: -0.5
    fonte: "NOAA CPC: La Niña com o índice de −0,5 °C ou menos, pelo RONI desde 01/02/2026 (NWS PNS 26-05; mesma ressalva das 5 estações seguidas)"
  estacoes:
    valor: [DJF, JFM, FMA]
    fonte: "Hipótese do time (tarefa 0035): média das estações DJF, JFM e FMA do ano da safrinha (dezembro do ano anterior a abril), da colheita da soja até a fase crítica. Não é critério da NOAA; Iizumi et al. (2014), Nature Communications 5:3712, também usam o índice de 3 meses na fase reprodutiva"

# Modelos de frase do "Por quê?" (PRD 7.6, plano técnico §4.8), sem IA generativa.
# Os campos entre chaves são preenchidos pela conta; o número da frase é o mesmo da conta.
#   seguranca: {data} {anos_aperto} {total} {calor_c} {fase} {fonte_chuva}
#   fase_cobertura: {dias}
#   futuro: {cenario} {modelos} {anos_bons} {total} {minimo} {maximo}
#   solo: {textura} {cad_mm} {fonte_solo}
#   historico: {parado} {plantou} {anos_certos} {sem_certeza} {total} {ano_inicio} {ano_fim}
#     (anos_certos = parado + plantou; sem_certeza = incerto + sem_dado; total = anos da janela)
#   balde_smap: {anos_smap} {total} {ano_inicio} {ano_fim} {padrao_pct}
#     (anos da série com o SMAP do dia de plantar, PRD 7.2; nos outros, o balde começa em
#     padrao_pct% da CAD)
#   historico_confirmado: os campos do historico mais {confirmadas} {vistas}
#     (quando o produtor confirmou alguma das últimas safras, tarefa 0039: confirmadas = anos
#     que ele respondeu; vistas = anos certos que vieram do satélite)
#   renda_com_grao, renda_sem_grao: sem campos (linha "Renda" da opção, tarefa 0040)
#   renda_risco: {anos_aperto} {total} (os anos com aperto do motor e os anos simulados)
frases:
  pt:
    seguranca: "Semeando em {data}, em {anos_aperto} dos últimos {total} anos faltou água ou fez calor de {calor_c} °C {fase} ({fonte_chuva})."
    fase_grao: "no florescimento"
    fase_cobertura: "nos primeiros {dias} dias"
    futuro: "No clima de 2041–2060 (NEX-GDDP-CMIP6, {cenario}, {modelos} modelos), daria certo em {anos_bons} de {total} anos (de {minimo} a {maximo}, conforme o modelo)."
    solo: "Conta feita com solo {textura} ({cad_mm} mm de água disponível; {fonte_solo})."
    historico: "Seu talhão ficou em pousio em {parado} de {anos_certos} entressafras vistas pelo satélite de {ano_inicio} a {ano_fim} (NDVI do MODIS)."
    balde_smap: "O balde de água começou com a umidade da terra medida pelo SMAP no dia de plantar em {anos_smap} dos {total} anos ({ano_inicio} a {ano_fim}); nos outros, com {padrao_pct}% da água disponível."
    fora_da_janela: "{cultura}: o plantio vai só até {limite} (ZARC), e com a colheita {faixa} não dá tempo."
    fora_da_janela_sugerida: "{cultura}: o plantio vai só até {limite} (data sugerida), e com a colheita {faixa} não dá tempo."
    colheita_cedo: "no começo de fevereiro"
    colheita_meio: "no meio de fevereiro"
    colheita_tarde: "no fim de fevereiro ou em março"
    historico_confirmado: "Seu talhão ficou em pousio em {parado} de {anos_certos} entressafras de {ano_inicio} a {ano_fim} (você confirmou {confirmadas}; o satélite viu {vistas}, pelo NDVI do MODIS)."
    renda_com_grao: "Dá grão para vender"
    renda_sem_grao: "Não dá grão: é investimento na terra"
    renda_risco: "Risco de perder a lavoura: faltou água ou fez calor em {anos_aperto} de {total} anos."
  en:
    seguranca: "Sowing on {data}, in {anos_aperto} of the last {total} years the crop ran short of water or had {calor_c} °C heat {fase} ({fonte_chuva})."
    fase_grao: "around flowering"
    fase_cobertura: "in the first {dias} days"
    futuro: "In the 2041–2060 climate (NEX-GDDP-CMIP6, {cenario}, {modelos} models), it would work in {anos_bons} of {total} years ({minimo} to {maximo}, depending on the model)."
    solo: "Computed with {textura} soil ({cad_mm} mm of available water; {fonte_solo})."
    historico: "Your field was left fallow in {parado} of {anos_certos} off-seasons seen by the satellite from {ano_inicio} to {ano_fim} (MODIS NDVI)."
    balde_smap: "The water bucket started from the soil moisture measured by SMAP on sowing day in {anos_smap} of the {total} years ({ano_inicio} to {ano_fim}); in the other years, at {padrao_pct}% of the available water."
    fora_da_janela: "{cultura}: sowing only until {limite} (ZARC); with the soybean harvest {faixa}, there is no time."
    fora_da_janela_sugerida: "{cultura}: sowing only until {limite} (suggested date); with the soybean harvest {faixa}, there is no time."
    colheita_cedo: "in early February"
    colheita_meio: "in mid-February"
    colheita_tarde: "in late February or March"
    historico_confirmado: "Your field was left fallow in {parado} of {anos_certos} off-seasons from {ano_inicio} to {ano_fim} (you confirmed {confirmadas}; the satellite saw {vistas}, with MODIS NDVI)."
    renda_com_grao: "Gives grain to sell"
    renda_sem_grao: "No grain: it is an investment in the soil"
    renda_risco: "Risk of losing the crop: water ran short or it was too hot in {anos_aperto} of {total} years."

# Textos da linha do tempo da safra (P4 e P6), sem IA generativa. RASCUNHO: agrônoma revisar.
#   semeadura, colheita_grao, colheita_cobertura: {opcao} (nome da opção)
#   aviso_veranico, voltou_chuva: {dias} (dias secos seguidos até o aviso / no total)
#   aviso_calor: {dias} (dias quentes seguidos) {temp_c} (clima.calor_temp_c)
#   fase_critica_cobertura: {dias} (clima.janela_cobertura_dias)
# A fase crítica do grão e do consórcio cai na floração estimada (dias_florescer do culturas.yaml,
# por isso "por volta de"); a da cobertura começa na semeadura.
frases_safra:
  pt:
    semeadura: "Semeadura: {opcao}."
    sem_chuva: "Parou de chover."
    aviso_veranico: "Aviso: {dias} dias sem chuva perto da fase que mais precisa de água. Converse com o agrônomo."
    fase_critica_grao: "Floração, por volta desta data: a fase que mais precisa de água."
    fase_critica_cobertura: "Começam os {dias} dias em que as plantas mais precisam de água para pegar."
    voltou_chuva: "Voltou a chover ({dias} dias sem chuva no total)."
    aviso_calor: "Aviso: {dias} dias seguidos com {temp_c} °C ou mais perto da fase que mais precisa de água. Converse com o agrônomo."
    colheita_grao: "Colheita: {opcao}."
    colheita_consorcio: "Colheita do milho. O capim segue cobrindo a terra."
    colheita_cobertura: "Fim do ciclo: {opcao}. A palhada fica cobrindo a terra."
  en:
    semeadura: "Sowing: {opcao}."
    sem_chuva: "Rain stopped."
    aviso_veranico: "Warning: {dias} days without rain close to the stage that needs water most. Talk to your agronomist."
    fase_critica_grao: "Flowering, around this date: the stage that needs water most."
    fase_critica_cobertura: "Start of the {dias} days when the plants need water most to establish."
    voltou_chuva: "Rain returned ({dias} days without rain in total)."
    aviso_calor: "Warning: {dias} days in a row at {temp_c} °C or more close to the stage that needs water most. Talk to your agronomist."
    colheita_grao: "Harvest: {opcao}."
    colheita_consorcio: "Corn harvest. The grass keeps covering the soil."
    colheita_cobertura: "End of the cycle: {opcao}. The straw keeps covering the soil."

# Detalhe de cada ano da faixa de chuva (P1, plano de evolução 4.1), sem IA generativa.
# RASCUNHO: agrônoma revisar. A frase junta, nesta ordem: a fase crítica com a seca, o resultado
# (deu_certo, ou faltou_agua e/ou calor, a mesma conta do aperto) e a marca do ENSO, se houver.
#   fase_grao: {ano} {semeadura} {data_fase} (floração estimada, por isso "por volta de") {seca}
#   fase_cobertura: {ano} {semeadura} {janela} (clima.janela_cobertura_dias) {seca}
#   {seca} = nenhum_dia_sem_chuva, um_dia_sem_chuva ou varios_dias_sem_chuva ({dias}): a maior
#     sequência de dias secos na fase crítica, com o dia seco dos avisos (avisos.dia_seco_abaixo_mm)
#   calor: {dias} (dias com calor na fase crítica) {temp_c} (clima.calor_temp_c)
frases_ano:
  pt:
    fase_grao: "Em {ano}, plantando em {semeadura}, a planta chegou na fase que mais precisa de água por volta de {data_fase} e {seca}."
    fase_cobertura: "Em {ano}, plantando em {semeadura}, nos primeiros {janela} dias, quando a planta mais precisa de água para pegar, a lavoura {seca}."
    nenhum_dia_sem_chuva: "não ficou nenhum dia sem chuva"
    um_dia_sem_chuva: "ficou 1 dia sem chuva"
    varios_dias_sem_chuva: "ficou {dias} dias sem chuva"
    deu_certo: "Deu certo."
    faltou_agua: "Faltou água nessa fase."
    calor: "Fez {dias} dias com {temp_c} °C ou mais nessa fase."
    el_nino: "Ano de El Niño."
    la_nina: "Ano de La Niña."
  en:
    fase_grao: "In {ano}, sowing on {semeadura}, the crop reached the stage that needs water most around {data_fase} and {seca}."
    fase_cobertura: "In {ano}, sowing on {semeadura}, in the first {janela} days, when the plants need water most to establish, the crop {seca}."
    nenhum_dia_sem_chuva: "did not go a single day without rain"
    um_dia_sem_chuva: "went 1 day without rain"
    varios_dias_sem_chuva: "went {dias} days without rain"
    deu_certo: "It worked."
    faltou_agua: "The crop ran short of water in this stage."
    calor: "It had {dias} days at {temp_c} °C or more in this stage."
    el_nino: "El Niño year."
    la_nina: "La Niña year."

comunidade:
  # Relatos da comunidade sem cadastro (seção 7 da remodelagem, tarefa 0047): plantio, chuva e
  # evento. O relato guarda só a célula de 0,1° do ponto, nunca a coordenada exata.
  raio_km:
    valor: 30.0
    fonte: "Pedido do usuário (seção 7 da remodelagem, 15/11/2026): a redondeza é o raio de 30 km em volta do ponto, pelas células de 0,1° cujo centro fica no raio"
  raio_max_km:
    valor: 50.0
    fonte: "Hipótese do time (tarefa 0047): maior raio que a listagem aceita, para a consulta não varrer a caixa inteira"
  chuva_max_mm:
    valor: 300.0
    fonte: "Pedido do usuário (seção 7 da remodelagem): a chuva relatada vai de 0 a 300 mm por dia"
  dias_atras_max:
    valor: 30
    fonte: "Pedido do usuário (seção 7 da remodelagem): datas de chuva e de evento não futuras e de no máximo 30 dias atrás"
  max_relatos_por_dia:
    valor: 10
    fonte: "Hipótese do time (o pedido da seção 7 dá 10 por dia como exemplo): no máximo 10 relatos por aparelho nas últimas 24 horas, para conter abuso sem cadastro"

agua:
  # Linha "Água" e selo "Sede da cultura" (seção 5.3 da remodelagem, tarefa 0044). Tudo sai do
  # balanço hídrico diário do motor (PRD 7.2), nos dias do ciclo de cada ano: "precisa" = mediana
  # do consumo da cultura (ETc = ETo x Kc); "chove" = mediana da chuva (GPM IMERG; nos anos sem
  # IMERG, NASA POWER); "falta" = ETc - ETr (o que a planta queria e a terra não tinha).
  # Na lavoura de demonstração (15/11), o consumo vai de ~230 mm (milheto) a ~360 mm (milho): os cortes
  # abaixo deixam milho em "muita", sorgo em "média" e milheto e crotalária em "pouca".
  sede_pouca_ate_mm:
    valor: 280.0
    fonte: "Hipótese do time (tarefa 0044): consumo da cultura no ciclo abaixo de 280 mm = pouca água. Só a ordem tem fonte: milho 500–800 mm, sorgo e milheto 450–650 mm no ciclo de verão (Brouwer & Heibloem, 1986, FAO Irrigation Water Management Training Manual 3, Tabela 14)"
  sede_muita_desde_mm:
    valor: 325.0
    fonte: "Hipótese do time (tarefa 0044): consumo da cultura no ciclo de 325 mm ou mais = muita água; entre os dois cortes, média. Só a ordem tem fonte (Brouwer & Heibloem, 1986, FAO, Tabela 14)"
  percentil_seco:
    valor: 20
    fonte: "Convenção do ZARC: níveis de risco de 20%, 30% e 40% (Portaria SPA/MAPA nº 324/2026, item 1.6); Sans et al. (2001), Rev. Bras. Agrometeorologia 9(3):527-535, usam o ISNA de 80% dos anos. Pedido da remodelagem, seção 5.3 ('percentil 20 dos 20 anos'), com o sentido do ano seco da tela 3: só 20% dos anos foram piores. Para a falta de água, em que mais é pior, é o percentil 80 da falta (interpolação linear entre os anos ordenados)"

enso_acerto:
  # Frase "Em anos de La Niña, deu certo em X de Y" da aba Sugestão (seção 5.4, tarefa 0044): só
  # aparece se a diferença for clara. Compara a taxa de acerto da opção nos anos daquela fase (ONI
  # da NOAA, grupo enso) com a dos outros anos da série. Só informa: não entra na conta.
  diferenca_min_pct:
    valor: 25.0
    fonte: "Hipótese do time, a revisar (tarefa 0044): diferença clara = 25 pontos percentuais ou mais entre a taxa de acerto nos anos da fase e nos outros anos (ex.: 3 de 7 contra 12 de 13)"
  anos_fase_min:
    valor: 5
    fonte: "Hipótese do time, a revisar (tarefa 0044): pelo menos 5 anos da fase na série, o mesmo mínimo do sinal do outono (sinal_enso.anos_fase_min); com menos, só a marcação por ano"

plano_b:
  # Plano A / Plano B da aba "Plano de 3 anos" (seção 5.6 da remodelagem, tarefa 0045). "Secar" vira
  # um número que o produtor confere no pluviômetro só se a série separar bem os anos em que a
  # cultura do 1º ano do Plano A deu certo dos anos em que ela falhou. Regra: "secou" = chuva somada
  # nos `dias_antes_semeadura` dias antes da semeadura abaixo de um limite L. L é o que mais acerta
  # na série (marca os k anos mais secos; acertos - alarmes falsos; empate = menos anos marcados).
  # Separa bem = as quatro condições abaixo juntas; senão, o Plano B aparece sem número.
  dias_antes_semeadura:
    valor: 15
    fonte: "Pedido da remodelagem, seção 5.6: 'o limite de chuva nos 15 dias antes da semeadura'"
  anos_falha_min:
    valor: 3
    fonte: "Hipótese do time, a revisar (tarefa 0045): com menos de 3 anos de falha na série, qualquer limite acerta por sorte"
  sensibilidade_min_pct:
    valor: 50.0
    fonte: "Hipótese do time, a revisar (tarefa 0045): o limite pega pelo menos metade dos anos em que a cultura falhou"
  precisao_min_pct:
    valor: 60.0
    fonte: "Hipótese do time, a revisar (tarefa 0045): pelo menos 60% dos anos abaixo do limite foram de falha (mais acertos que alarmes falsos)"
  chance_max_pct:
    valor: 10.0
    fonte: "Hipótese do time, a revisar (tarefa 0045): a chance de pegar tantas falhas marcando o mesmo número de anos ao acaso (hipergeométrica) fica em 10% ou menos"

chuva_aproveitada:
  # Bloco "Chuva aproveitada" do Plano (seção 5.6, tarefa 0045): a chuva da semeadura (colheita da
  # soja + 3 dias, PRD 7.1) até o fim de julho, e quanto dela a planta usou (ETr do balanço do motor,
  # PRD 7.2). No pousio, só a chuva que caiu sem cultura (sem estimar a evaporação da terra).
  fim:
    valor: "07-31"
    fonte: "Pedido da remodelagem, seção 5.6: 'entre a colheita da soja e o fim de julho' (a série guardada vai até 31/jul; 30/jul nos anos bissextos)"

plano_cadeia:
  # Sugestão em cadeia do plano de 3 anos (pacote 2, tela 5; tarefa 0056). O produtor fixa o 1º ano
  # (ou o 1º e o 2º) e o motor sugere os seguintes com a mesma conta do PRD 7.7 (média das notas
  # finais + bônus de diversidade, as mesmas restrições, só culturas no prazo do ZARC) mais os pontos
  # abaixo em cada ano sugerido, olhando o ano anterior. HIPÓTESE DO TIME, A REVISAR PELA AGRÔNOMA:
  # os pontos, as listas e as frases do grupo `frases_plano`. Na lavoura de demonstração (15/11), com
  # 10 pontos o milheto passa a crotalária depois da terra parada na colheita do meio de fevereiro
  # (a crotalária ganha +5 de diversidade a mais; com menos de 7,5 pontos, ela ficaria).
  bonus_cobrir_depois_do_parado:
    valor: 10.0
    fonte: "Hipótese do time, a revisar pela agrônoma (tela 5 do pacote 2: 'depois de deixar parado, uma cobertura que cubra rápido'): pontos na nota do plano para a cultura de `culturas_cobertura_rapida` no ano seguinte a um pousio que o produtor escolheu (o motor não sugere deixar parado para ganhar estes pontos), o mesmo tamanho do bônus de 3 funções do PRD 7.7"
  bonus_quebrar_nematoide_depois_do_milho:
    valor: 5.0
    fonte: "Hipótese do time, a revisar pela agrônoma (tela 5: 'quebrar o nematoide depois do milho'): pontos para uma supressora do nematoide (rotacao.culturas_supressoras_nematoide, PRD 7.7) no ano seguinte a uma cultura de `culturas_que_multiplicam_nematoide`, o tamanho do bônus de 2 funções do PRD 7.7"
  bonus_variar_funcao:
    valor: 3.0
    fonte: "Hipótese do time, a revisar pela agrônoma (tela 5: 'diversidade de função'): pontos quando a cultura não repete nenhuma função do ano anterior (rotacao.funcoes: grão, cobertura gramínea, cobertura leguminosa; o pousio não tem função). Menor que o bônus de diversidade do PRD 7.7, que já conta as funções do plano inteiro"
  culturas_cobertura_rapida:
    valor: [milheto]
    fonte: "Pacheco et al. (2017), PAB 52(8):582-591, doi:10.1590/S0100-204X2017000800003: o milheto solteiro teve o estabelecimento mais rápido e mais cobertura do solo na safrinha. Entre as 6 opções é a cobertura que fecha a terra mais rápido (a braquiária vem junto com o milho)"
  culturas_que_multiplicam_nematoide:
    valor: [milho_safrinha, milho_braquiaria, sorgo]
    fonte: "Debiasi et al. (2016), PAB 51(10):1720-1728: a maior parte dos híbridos de milho e de sorgo e as braquiárias são hospedeiros favoráveis de Pratylenchus brachyurus; no campo, milho e braquiárias não reduziram o nematoide (tela 5: 'quebrar o nematoide depois do milho')"

# O "Por quê:" de cada ano sugerido do plano de 3 anos (tarefa 0056), sem IA generativa.
# RASCUNHO: agrônoma revisar. Uma frase pela regra que pesou, nesta ordem: cobrir depois do parado,
# quebrar o nematoide depois do milho, prazo do ZARC, variar a função (grão depois de cobertura,
# cobertura depois de grão ou outra troca); sem nenhuma, a melhor nota. Com a sede "pouca" da linha
# "Água" (grupo agua), a frase ganha o `aguenta_seca` (desde a tarefa 0066, "pede pouca água": a
# sede mede o consumo, não a tolerância à seca). Sem o nome da cultura: a tela mostra o nome logo
# antes do "Por quê:".
#   prazo: {cultura_fora} (a cultura que ganharia sem o prazo) {limite_fora} e {limite} (o prazo
#     do ZARC de cada uma, "28/02" / "Feb 28"); prazo_sugerido: o mesmo, quando a cultura_fora não
#     tem ZARC (crotalária, tarefa 0066)
#   aguenta_seca: {motivo} (a frase da regra)
# Tarefa 0066: "ajuda a baixar" no lugar de "quebra o ciclo" (a crotalária reduz o nematoide das
# lesões antes e no começo da soja, mas na colheita da soja a diferença some: Debiasi et al., 2016).
frases_plano:
  pt:
    cobrir_depois_do_parado: "a terra ficou descoberta; cobre rápido"
    quebrar_nematoide_depois_do_milho: "ajuda a baixar o nematoide que o milho e o sorgo multiplicam"
    grao_depois_da_cobertura: "dá grão para vender depois de um ano cuidando da terra"
    cobertura_depois_do_grao: "cuida da terra depois de um ano de grão"
    variar_funcao: "varia a função da planta na rotação"
    prazo: "{cultura_fora} passou do prazo do ZARC ({limite_fora}); esta cabe no prazo (até {limite})"
    prazo_sugerido: "{cultura_fora} passou da data sugerida ({limite_fora}); esta cabe no prazo (até {limite})"
    melhor_nota: "tem a melhor nota do motor para esta colheita"
    aguenta_seca: "{motivo} e pede pouca água"
  en:
    cobrir_depois_do_parado: "the soil was left bare; it covers it fast"
    quebrar_nematoide_depois_do_milho: "it helps lower the nematodes that corn and sorghum build up"
    grao_depois_da_cobertura: "it gives grain to sell after a year caring for the soil"
    cobertura_depois_do_grao: "it cares for the soil after a year of grain"
    variar_funcao: "it varies the role of the crop in the rotation"
    prazo: "{cultura_fora} is past the ZARC deadline ({limite_fora}); this one fits (until {limite})"
    prazo_sugerido: "{cultura_fora} is past the suggested date ({limite_fora}); this one fits (until {limite})"
    melhor_nota: "it has the engine's best score for this harvest"
    aguenta_seca: "{motivo} and needs little water"

# Fonte de cada regra da tela "Como a conta é feita" (GET /api/metodo, campo `fontes`; tarefa 0066).
# Só fontes abertas e conferidas (artigo revisado, livro técnico ou fonte oficial), em forma curta.
# hipotese: "nao" (todos os números da regra têm fonte), "parte" (algum continua hipótese do time) ou
# "sim" (nenhum tem fonte). A tela mostra "ainda não validado em campo" só quando não é "nao".
# Revisão completa: docs/tarefas/0066-regras-com-fonte.md.
fontes_metodo:
  deu_certo:
    hipotese: parte  # os 3 dias de calor, os 30 dias e o ISNA da crotalária
    citacoes:
      - citacao: "ZARC de MG: ISNA de cada cultura (Portaria SPA/MAPA nº 324/2026, milho; nº 339/2026, consórcio; nº 275/2026, sorgo; nº 345/2020, milheto)"
        url: "https://www.gov.br/agricultura/pt-br/assuntos/riscos-seguro/programa-nacional-de-zoneamento-agricola-de-risco-climatico/portarias/safra-vigente/minas-gerais/minas-gerais-mg"
      - citacao: "Andrade et al. (1999), Crop Science 39(2): período crítico do milho em volta do embonecamento"
        url: "https://doi.org/10.2135/cropsci1999.0011183X0039000200026x"
      - citacao: "Hatfield & Prueger (2015), Weather and Climate Extremes 10: pólen do milho acima de 35 °C"
        url: "https://doi.org/10.1016/j.wace.2015.08.001"
  pesos:
    hipotese: sim
    citacoes: []
  renda:
    hipotese: sim
    citacoes: []
  agua:
    hipotese: nao
    citacoes:
      - citacao: "Allen et al. (1998), FAO Irrigation and Drainage Paper 56: ETc = ETo × Kc"
        url: "https://www.fao.org/4/x0490e/x0490e0b.htm"
      - citacao: "ZARC: níveis de risco de 20%, 30% e 40% (Portaria SPA/MAPA nº 324/2026)"
        url: "https://www.in.gov.br/web/dou/-/portaria-spa/mapa-n-324-de-28-de-julho-de-2026-722143549"
  sede:
    hipotese: sim
    citacoes: []
  rotacao:
    hipotese: parte  # os pontos do bônus
    citacoes:
      - citacao: "Debiasi et al. (2016), Pesquisa Agropecuária Brasileira 51(10): só as crotalárias reduziram o nematoide das lesões no campo"
        url: "https://doi.org/10.1590/S0100-204X2016001000003"
      - citacao: "McDaniel et al. (2014), Ecological Applications 24(3): rotação com mais culturas melhora o carbono e o nitrogênio do solo"
        url: "https://doi.org/10.1890/13-0616.1"
  plano_b:
    hipotese: sim
    citacoes: []
  geada:
    hipotese: nao
    citacoes:
      - citacao: "Wrege et al. (2018), Revista Brasileira de Climatologia 22: mínima abaixo de 3 °C no abrigo indica geada no chão"
        url: "https://ojs.ufgd.edu.br/rbclima/article/download/14053/7294/45093"
  chuva_forte:
    hipotese: nao
    citacoes:
      - citacao: "INMET, avisos de Chuvas Intensas: 'Perigo' com 50 a 100 mm por dia"
        url: "https://apiprevmet3.inmet.gov.br/avisos/rss"
  fogo:
    hipotese: sim
    citacoes: []
  avisos:
    hipotese: parte  # os dias seguidos e a janela
    citacoes:
      - citacao: "Hatfield & Prueger (2015), Weather and Climate Extremes 10: calor de 35 °C"
        url: "https://doi.org/10.1016/j.wace.2015.08.001"
  sinal:
    hipotese: parte  # a chance mínima, os 5 anos e a metade dos anos
    citacoes:
      - citacao: "NOAA CPC: previsão oficial do ENSO e índice RONI, ±0,5 °C (NWS PNS 26-05, 2026)"
        url: "https://www.weather.gov/media/notification/pdf_2026/pns26-05_Relative_ONI.pdf"
      - citacao: "Minuzzi et al. (2007), Revista Brasileira de Meteorologia 22(3): La Niña e a estação chuvosa no Sudeste"
        url: "https://doi.org/10.1590/S0102-77862007000300008"
