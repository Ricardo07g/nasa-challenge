# ==============================================================================
# Regras do motor de pontuação (Raiz Orbital), versão 0
# Referência: PRD seção 7 e plano técnico §4. Editável pela agrônoma sem mexer no código.
#
# Cada número tem `valor` e `fonte`. A API não carrega um número sem fonte.
# "Hipótese do time" = valor a calibrar com a agrônoma e com os resultados reais.
# Os parâmetros de cada cultura (ciclo, Kc, data limite, nota de solo, dinheiro) ficam em
# culturas.yaml.
# ==============================================================================

clima:
  # Ano com aperto (PRD 7.2): ISNA abaixo do limiar na janela crítica OU calor na janela.
  isna_grao:
    valor: 0.55
    fonte: "PRD 7.2 e plano técnico §4.2: ISNA de 0,55 do ZARC da soja em MG na floração e no enchimento (hipótese aplicada ao milho e ao sorgo)"
  isna_cobertura:
    valor: 0.50
    fonte: "PRD 7.2 item 4: cobertura falha no estabelecimento com ISNA abaixo de 0,50"
  janela_grao_meia_dias:
    valor: 15
    fonte: "PRD 7.2 item 2: janela crítica de 15 dias antes a 15 dias depois do florescimento"
  janela_cobertura_dias:
    valor: 30
    fonte: "PRD 7.2 item 4: estabelecimento da cobertura nos primeiros 30 dias"
  calor_temp_c:
    valor: 35.0
    fonte: "PRD 7.2 item 3: máxima de 35 °C ou mais na floração, ligada a aborto de flores"
  calor_min_dias:
    valor: 3
    fonte: "PRD 7.2 item 3: 3 dias ou mais com calor na janela crítica"
  # Perda de produtividade pelo ISNA, usada na margem (PRD 7.5)
  perda_isna_sem_perda:
    valor: 0.65
    fonte: "PRD 7.5: perda de 0% com ISNA de 0,65 ou mais (hipótese do time)"
  perda_isna_alta_abaixo:
    valor: 0.55
    fonte: "PRD 7.5: perda de 60% com ISNA abaixo de 0,55 (hipótese do time)"
  perda_fator_media:
    valor: 0.30
    fonte: "PRD 7.5: perda de 30% com ISNA entre 0,55 e 0,65 (hipótese do time)"
  perda_fator_alta:
    valor: 0.60
    fonte: "PRD 7.5: perda de 60% com ISNA abaixo de 0,55 (hipótese do time)"

nota_final:
  # Nota final = soma de (peso x nota). Sem CMIP6, o futuro sai e os outros pesos são reescalados.
  peso_seguranca:
    valor: 0.30
    fonte: "PRD 7.6 e RF-05; plano técnico §4.5: pesos padrão 30/25/30/15"
  peso_solo:
    valor: 0.25
    fonte: "PRD 7.6 e RF-05; plano técnico §4.5: pesos padrão 30/25/30/15"
  peso_renda:
    valor: 0.30
    fonte: "PRD 7.6 e RF-05; plano técnico §4.5: pesos padrão 30/25/30/15"
  peso_futuro:
    valor: 0.15
    fonte: "PRD 7.6 e RF-05; plano técnico §4.5: pesos padrão 30/25/30/15"
  bonus_gado_milho_braquiaria:
    valor: 15.0
    fonte: "ADR-0004: com gado = sim, milho + braquiária ganha 15 pontos (pecuária ainda em decisão, R4.7)"

rotulos:
  # Rótulos que o produtor vê (PRD 7.6, plano técnico §4.4; hipótese do time)
  chuva_bom_pct:
    valor: 85.0
    fonte: "PRD 7.6: chuva Bom com 17 a 20 anos sem aperto (17 de 20 = 85%)"
  chuva_medio_pct:
    valor: 60.0
    fonte: "PRD 7.6: chuva Médio com 12 a 16 anos sem aperto (12 de 20 = 60%)"
  terra_bom:
    valor: 50.0
    fonte: "PRD 7.6: terra Bom com nota de solo 50 ou mais"
  terra_medio:
    valor: 20.0
    fonte: "PRD 7.6: terra Médio com nota de solo de 20 a 49"
  dinheiro_bom:
    valor: 70.0
    fonte: "PRD 7.6: dinheiro Bom com nota de renda 70 ou mais"
  dinheiro_medio:
    valor: 30.0
    fonte: "PRD 7.6: dinheiro Médio com nota de renda de 30 a 69"

solo:
  # Nota de solo (PRD 7.4): palhada + nitrogênio + quebra de pragas; os pontos por cultura ficam
  # em culturas.yaml (nota_solo).
  palhada_max:
    valor: 40.0
    fonte: "PRD 7.4: palhada vale até 40 pontos"
  nitrogenio_max:
    valor: 30.0
    fonte: "PRD 7.4: nitrogênio vale até 30 pontos"
  pragas_max:
    valor: 30.0
    fonte: "PRD 7.4: quebra de pragas vale até 30 pontos"
  peso_pragas_nematoide:
    valor: 1.5
    fonte: "PRD 7.4: com nematoide = sim, a coluna de pragas vale 1,5 vez e o total é reescalado para 0 a 100"

ndvi:
  # Colheita sugerida pela série de NDVI do MODIS, já com o fator 0,0001 (PRD 7.9).
  # Os limites do histórico do talhão (PRD 7.8) ficam em historico_ndvi.
  queda_colheita:
    valor: 0.50
    fonte: "PRD 7.9: soja secando quando o NDVI cai abaixo de 50% do pico do verão"

historico_ndvi:
  # Histórico do talhão pelo NDVI do MODIS (PRD 7.8 e guia do histórico NDVI, "Regra do talhão").
  # Por ano: observações boas (qualidade 0 ou 1) da janela; menos de `min_observacoes` = sem_dado;
  # maior NDVI acima de `limite_plantou` = plantou; abaixo de `limite_parado` = parado; senão incerto.
  janela_inicio:
    valor: "04-01"
    fonte: "PRD 7.8 e guia do histórico NDVI: entressafra de 1º de abril a 31 de julho (a soja do Triângulo é colhida em fevereiro e março)"
  janela_fim:
    valor: "07-31"
    fonte: "PRD 7.8 e guia do histórico NDVI: entressafra de 1º de abril a 31 de julho"
  limite_plantou:
    valor: 0.60
    fonte: "PRD 7.8: maior NDVI da entressafra acima de 0,6 = segunda safra ou cobertura (Embrapa, 2021; a calibrar com 5 talhões)"
  limite_parado:
    valor: 0.45
    fonte: "PRD 7.8: maior NDVI da entressafra abaixo de 0,45 = pousio (Embrapa, 2021; a calibrar com 5 talhões)"
  min_observacoes:
    valor: 3
    fonte: "Guia do histórico NDVI (Regra do talhão): com menos de 3 observações boas na janela, o ano fica sem_dado (hipótese do time, a calibrar)"
  ano_inicio:
    valor: 2016
    fonte: "Decisão do time (roteiro §5, R3.2): entressafras de 2016 a 2025, como o plano técnico, o guia NDVI e o Lovable (o PRD RF-08 dizia 2015)"
  ano_fim:
    valor: 2025
    fonte: "Decisão do time (roteiro §5, R3.2): entressafras de 2016 a 2025, 10 anos"

regiao_ndvi:
  # Região pelo satélite (P3, RF-23, tarefa 0036): dentro da máscara de lavoura (MCD12Q1 classe 12)
  # de cada ano, um pixel só é "soja daquele ano" se mostrar a soja E a colheita. Pixel sem pico ou
  # sem colheita (cana, café, pasto, solo exposto) fica fora dos percentuais. Os pixels que passam são
  # classificados pela regra do talhão (historico_ndvi: qualidade 0/1, mínimo de observações, limites),
  # só com as observações depois da colheita até entressafra_fim. Datas "MM-DD"; NDVI de -1 a 1.
  pico_inicio:
    valor: "01-01"
    fonte: "Hipótese do time, a revisar pela agrônoma; substitui a máscara de soja do MapBiomas do guia NDVI. Início da janela do pico da soja"
  pico_fim:
    valor: "03-15"
    fonte: "Hipótese do time, a revisar pela agrônoma; substitui a máscara de soja do MapBiomas do guia NDVI. Fim da janela do pico da soja"
  pico_min_ndvi:
    valor: 0.70
    fonte: "Hipótese do time, a revisar pela agrônoma; substitui a máscara de soja do MapBiomas do guia NDVI. Maior NDVI da janela do pico a partir do qual há soja"
  colheita_fim:
    valor: "05-15"
    fonte: "Hipótese do time, a revisar pela agrônoma; substitui a máscara de soja do MapBiomas do guia NDVI. Última data em que se procura a colheita depois do pico"
  colheita_max_ndvi:
    valor: 0.40
    fonte: "Hipótese do time, a revisar pela agrônoma; substitui a máscara de soja do MapBiomas do guia NDVI. NDVI até o qual a observação depois do pico conta como colheita"
  entressafra_fim:
    valor: "07-31"
    fonte: "Hipótese do time, a revisar pela agrônoma; substitui a máscara de soja do MapBiomas do guia NDVI. Fim da entressafra (o mesmo do historico_ndvi.janela_fim do talhão)"

soja_recente:
  # Soja na safra mais recente no ponto marcado (RF-24, tarefa 0037): no começo do fluxo, o app
  # confere se o satélite viu soja no pixel de 250 m do MODIS, para saber que o ponto é lavoura (e
  # não cidade, cana ou pasto). Pixel: maior NDVI das observações boas (qualidade 0 ou 1, MOD13Q1 e
  # MYD13Q1) da janela; menos de `min_observacoes` = sem dado (nenhum aviso). O
  # pipeline/fetch_soja_recente.py usa a janela e o mínimo ao gravar o pico de cada pixel; a API
  # compara o pico com `ndvi_minimo`.
  # INTEGRAÇÃO: o `ndvi_minimo` e a janela são os mesmos números do pico da soja da região
  # calibrada (tarefa 0036: `regiao_ndvi.pico_min_ndvi`, `pico_inicio` e `pico_fim`). Os dois grupos
  # devem virar um só.
  janela_inicio:
    valor: "01-01"
    fonte: "Hipótese do time, a revisar pela agrônoma (decisão do usuário de 15/11/2026): a soja do Triângulo fica verde em janeiro e é colhida em fevereiro e março"
  janela_fim:
    valor: "03-15"
    fonte: "Hipótese do time, a revisar pela agrônoma (decisão do usuário de 15/11/2026): janela de 1º de janeiro a 15 de março"
  ndvi_minimo:
    valor: 0.70
    fonte: "Hipótese do time, a revisar pela agrônoma (decisão do usuário de 15/11/2026): soja vista com o maior NDVI da janela de 0,70 ou mais; o mesmo limite do pico da soja da região (regiao_ndvi.pico_min_ndvi, tarefa 0036)"
  min_observacoes:
    valor: 2
    fonte: "Hipótese do time, a revisar pela agrônoma (decisão do usuário de 15/11/2026): com menos de 2 observações boas na janela (verão com nuvem), o pixel fica sem dado e o app não avisa"

rotacao:
  # Plano de 3 anos (PRD 7.7)
  anos_secos:
    valor: 4
    fonte: "PRD 7.7 e plano técnico §4.6: cenário ano seco com os 4 anos mais secos da série"
  meses_seco:
    valor: [2, 3, 4]
    fonte: "PRD 7.7: ano seco = menor chuva de fevereiro a abril"
  max_pousios:
    valor: 2
    fonte: "PRD 7.7: descartar mais de 2 pousios seguidos (o pousio entra nas 216 combinações)"
  bonus_diversidade_2:
    valor: 5.0
    fonte: "PRD 7.7: +5 com 2 funções diferentes"
  bonus_diversidade_3:
    valor: 10.0
    fonte: "PRD 7.7: +10 com 3 funções diferentes (grão, cobertura gramínea, cobertura leguminosa)"
  # A penalidade de 12 pontos para milho safrinha nos 3 anos saiu no R4.3 (tarefa 0016): não está no
  # PRD 7.7, e o bônus por função já deixa o milho repetido sem os +5/+10.
  culturas_supressoras_nematoide:
    valor: [crotalaria, milheto]
    fonte: "PRD 7.7: com nematoide = sim, descartar 3 anos sem crotalária ou milheto (só quando uma delas cabe na janela; sem nenhuma, o plano sai e a descrição avisa)"
  funcoes:
    # O bônus de diversidade conta as funções diferentes do plano, não as culturas.
    valor:
      pousio: []
      milho_safrinha: [grao]
      sorgo: [grao]
      milho_braquiaria: [grao, cobertura_graminea]
      milheto: [cobertura_graminea]
      crotalaria: [cobertura_leguminosa]
    fonte: "PRD 5 (coluna Função) e 7.7 (grão, cobertura gramínea, cobertura leguminosa). Milho + braquiária conta grão e cobertura gramínea, porque o PRD 5 diz 'Grão + cobertura' e a braquiária é gramínea (hipótese do time, revisar com a agrônoma)"

sinal_outono:
  # Sinal para o outono e regra do dia de plantar (PRD 7.10, RF-20; plano de evolução, ajuste A2).
  # Hipótese a calibrar com as previsões retrospectivas do GMAO antes de publicar (tarefa A2.5).
  chance_seco_min:
    valor: 0.50
    fonte: "PRD 7.10: sinal de seco com chance de chuva abaixo do normal em março a maio de 50% ou mais (GEOS-S2S; hipótese a calibrar)"
  chance_normal_max:
    valor: 0.33
    fonte: "PRD 7.10: sinal de normal com chance de chuva abaixo do normal menor que 33% e terra sem falta de água (hipótese a calibrar)"
  smap_percentil_seco:
    valor: 20.0
    fonte: "PRD 7.10: terra seca com o SMAP sm_rootzone_pctl abaixo do percentil 20 (e a chuva recente baixa)"
  chuva_fracao_seco:
    valor: 0.60
    fonte: "PRD 7.10: terra seca com a chuva dos últimos 30 dias pelo IMERG abaixo de 60% da média (e o SMAP baixo)"

avisos:
  # Avisos da safra: replay de uma safra passada (P4) e acompanhamento diário (P6), plano de
  # evolução 4.4. A janela crítica e a temperatura do calor são as do grupo clima (mesma conta do
  # aperto). Um aviso de veranico por sequência seca e um de calor por sequência quente.
  dia_seco_abaixo_mm:
    valor: 1.0
    fonte: "Hipótese do time, a revisar com a agrônoma: dia seco = chuva abaixo de 1 mm, como o índice CDD do ETCCDI (OMM). O plano de evolução 4.4 não define o dia seco do aviso; com os 5 mm do P1 (4.1), a fazenda de exemplo teria aviso de veranico em 19 de 20 anos; com 1 mm, em 11, incluindo os 7 anos com aperto do motor"
  veranico_min_dias:
    valor: 10
    fonte: "Plano de evolução 4.4 (regras do Doc 5, no PRD): 10 ou mais dias secos na fase crítica"
  calor_dias_seguidos:
    valor: 2
    fonte: "Plano de evolução 4.4 (regras do Doc 5, no PRD): 2 dias seguidos com máxima de 35 °C ou mais"
  max_avisos:
    valor: 2
    fonte: "Plano de evolução 4.4: no máximo 2 avisos por semana por talhão, para não virar ruído"
  janela_limite_dias:
    valor: 7
    fonte: "Plano de evolução 4.4: a semana do limite de avisos; hipótese do time: 7 dias corridos que terminam no dia do aviso (a revisar)"

enso:
  # Marca de El Niño / La Niña de cada safrinha no detalhe dos anos (P1, plano de evolução 4.1).
  # Só informa: não entra na conta. É dado da NOAA, não da NASA. O pipeline/fetch_oni.py usa estes
  # números ao gravar a fase de cada ano no arquivo do ONI (ONI_PATH); a API lê a fase pronta.
  el_nino_oni_min:
    valor: 0.5
    fonte: "NOAA CPC (ONI_v5, https://origin.cpc.ncep.noaa.gov/products/analysis_monitoring/ensostuff/ONI_v5.php): El Niño com ONI de +0,5 °C ou mais. A NOAA pede 5 estações seguidas para chamar de episódio; aqui vale a média das estações abaixo (hipótese do time, a revisar)"
  la_nina_oni_max:
    valor: -0.5
    fonte: "NOAA CPC (ONI_v5): La Niña com ONI de −0,5 °C ou menos (mesma ressalva das 5 estações seguidas)"
  estacoes:
    valor: [DJF, JFM, FMA]
    fonte: "Hipótese do time (tarefa 0035, a revisar): média do ONI das estações DJF, JFM e FMA do ano da safrinha (dezembro do ano anterior a abril), o verão e o começo do outono, da colheita da soja até a fase crítica. É quando o ENSO costuma estar no auge (o El Niño de 2015/16 marca a safrinha de 2016)"

# Modelos de frase do "Por quê?" (PRD 7.6, plano técnico §4.8), sem IA generativa.
# Os campos entre chaves são preenchidos pela conta; o número da frase é o mesmo da conta.
#   seguranca: {data} {anos_aperto} {total} {calor_c} {fase} {fonte_chuva}
#   fase_cobertura: {dias}
#   futuro: {cenario} {modelos} {anos_bons} {total} {minimo} {maximo}
#   solo: {textura} {cad_mm} {fonte_solo}
#   historico: {parado} {plantou} {anos_certos} {sem_certeza} {total} {ano_inicio} {ano_fim}
#     (anos_certos = parado + plantou; sem_certeza = incerto + sem_dado; total = anos da janela)
#   balde_smap: {anos_smap} {total} {ano_inicio} {ano_fim} {padrao_pct}
#     (anos da série com o SMAP do dia de plantar, PRD 7.2; nos outros, o balde começa em
#     padrao_pct% da CAD)
frases:
  pt:
    seguranca: "Semeando em {data}, em {anos_aperto} dos últimos {total} anos faltou água ou fez calor de {calor_c} °C {fase} ({fonte_chuva})."
    fase_grao: "no florescimento"
    fase_cobertura: "nos primeiros {dias} dias"
    futuro: "No clima de 2041–2060 (NEX-GDDP-CMIP6, {cenario}, {modelos} modelos), daria certo em {anos_bons} de {total} anos (de {minimo} a {maximo}, conforme o modelo)."
    solo: "Conta feita com solo {textura} ({cad_mm} mm de água disponível; {fonte_solo})."
    historico: "Seu talhão ficou em pousio em {parado} de {anos_certos} entressafras vistas pelo satélite de {ano_inicio} a {ano_fim} (NDVI do MODIS)."
    balde_smap: "O balde de água começou com a umidade da terra medida pelo SMAP no dia de plantar em {anos_smap} dos {total} anos ({ano_inicio} a {ano_fim}); nos outros, com {padrao_pct}% da água disponível."
    fora_da_janela: "{cultura}: o plantio vai só até {limite} (ZARC), e com a colheita {faixa} não dá tempo."
    colheita_cedo: "no começo de fevereiro"
    colheita_meio: "no meio de fevereiro"
    colheita_tarde: "no fim de fevereiro ou em março"
  en:
    seguranca: "Sowing on {data}, in {anos_aperto} of the last {total} years the crop ran short of water or had {calor_c} °C heat {fase} ({fonte_chuva})."
    fase_grao: "around flowering"
    fase_cobertura: "in the first {dias} days"
    futuro: "In the 2041–2060 climate (NEX-GDDP-CMIP6, {cenario}, {modelos} models), it would work in {anos_bons} of {total} years ({minimo} to {maximo}, depending on the model)."
    solo: "Computed with {textura} soil ({cad_mm} mm of available water; {fonte_solo})."
    historico: "Your field was left fallow in {parado} of {anos_certos} off-seasons seen by the satellite from {ano_inicio} to {ano_fim} (MODIS NDVI)."
    balde_smap: "The water bucket started from the soil moisture measured by SMAP on sowing day in {anos_smap} of the {total} years ({ano_inicio} to {ano_fim}); in the other years, at {padrao_pct}% of the available water."
    fora_da_janela: "{cultura}: sowing only until {limite} (ZARC); with the soybean harvest {faixa}, there is no time."
    colheita_cedo: "in early February"
    colheita_meio: "in mid-February"
    colheita_tarde: "in late February or March"

# Textos da linha do tempo da safra (P4 e P6), sem IA generativa. RASCUNHO: agrônoma revisar.
#   semeadura, colheita_grao, colheita_cobertura: {opcao} (nome da opção)
#   aviso_veranico, voltou_chuva: {dias} (dias secos seguidos até o aviso / no total)
#   aviso_calor: {dias} (dias quentes seguidos) {temp_c} (clima.calor_temp_c)
#   fase_critica_cobertura: {dias} (clima.janela_cobertura_dias)
# A fase crítica do grão e do consórcio cai na floração estimada (dias_florescer do culturas.yaml,
# por isso "por volta de"); a da cobertura começa na semeadura.
frases_safra:
  pt:
    semeadura: "Semeadura: {opcao}."
    sem_chuva: "Parou de chover."
    aviso_veranico: "Aviso: {dias} dias sem chuva perto da fase que mais precisa de água. Converse com o agrônomo."
    fase_critica_grao: "Floração, por volta desta data: a fase que mais precisa de água."
    fase_critica_cobertura: "Começam os {dias} dias em que as plantas mais precisam de água para pegar."
    voltou_chuva: "Voltou a chover ({dias} dias sem chuva no total)."
    aviso_calor: "Aviso: {dias} dias seguidos com {temp_c} °C ou mais perto da fase que mais precisa de água. Converse com o agrônomo."
    colheita_grao: "Colheita: {opcao}."
    colheita_consorcio: "Colheita do milho. O capim segue cobrindo a terra."
    colheita_cobertura: "Fim do ciclo: {opcao}. A palhada fica cobrindo a terra."
  en:
    semeadura: "Sowing: {opcao}."
    sem_chuva: "Rain stopped."
    aviso_veranico: "Warning: {dias} days without rain close to the stage that needs water most. Talk to your agronomist."
    fase_critica_grao: "Flowering, around this date: the stage that needs water most."
    fase_critica_cobertura: "Start of the {dias} days when the plants need water most to establish."
    voltou_chuva: "Rain returned ({dias} days without rain in total)."
    aviso_calor: "Warning: {dias} days in a row at {temp_c} °C or more close to the stage that needs water most. Talk to your agronomist."
    colheita_grao: "Harvest: {opcao}."
    colheita_consorcio: "Corn harvest. The grass keeps covering the soil."
    colheita_cobertura: "End of the cycle: {opcao}. The straw keeps covering the soil."

# Detalhe de cada ano da faixa de chuva (P1, plano de evolução 4.1), sem IA generativa.
# RASCUNHO: agrônoma revisar. A frase junta, nesta ordem: a fase crítica com a seca, o resultado
# (deu_certo, ou faltou_agua e/ou calor, a mesma conta do aperto) e a marca do ENSO, se houver.
#   fase_grao: {ano} {semeadura} {data_fase} (floração estimada, por isso "por volta de") {seca}
#   fase_cobertura: {ano} {semeadura} {janela} (clima.janela_cobertura_dias) {seca}
#   {seca} = nenhum_dia_sem_chuva, um_dia_sem_chuva ou varios_dias_sem_chuva ({dias}): a maior
#     sequência de dias secos na fase crítica, com o dia seco dos avisos (avisos.dia_seco_abaixo_mm)
#   calor: {dias} (dias com calor na fase crítica) {temp_c} (clima.calor_temp_c)
frases_ano:
  pt:
    fase_grao: "Em {ano}, plantando em {semeadura}, a planta chegou na fase que mais precisa de água por volta de {data_fase} e {seca}."
    fase_cobertura: "Em {ano}, plantando em {semeadura}, nos primeiros {janela} dias, quando a planta mais precisa de água para pegar, a lavoura {seca}."
    nenhum_dia_sem_chuva: "não ficou nenhum dia sem chuva"
    um_dia_sem_chuva: "ficou 1 dia sem chuva"
    varios_dias_sem_chuva: "ficou {dias} dias sem chuva"
    deu_certo: "Deu certo."
    faltou_agua: "Faltou água nessa fase."
    calor: "Fez {dias} dias com {temp_c} °C ou mais nessa fase."
    el_nino: "Ano de El Niño."
    la_nina: "Ano de La Niña."
  en:
    fase_grao: "In {ano}, sowing on {semeadura}, the crop reached the stage that needs water most around {data_fase} and {seca}."
    fase_cobertura: "In {ano}, sowing on {semeadura}, in the first {janela} days, when the plants need water most to establish, the crop {seca}."
    nenhum_dia_sem_chuva: "did not go a single day without rain"
    um_dia_sem_chuva: "went 1 day without rain"
    varios_dias_sem_chuva: "went {dias} days without rain"
    deu_certo: "It worked."
    faltou_agua: "The crop ran short of water in this stage."
    calor: "It had {dias} days at {temp_c} °C or more in this stage."
    el_nino: "El Niño year."
    la_nina: "La Niña year."
