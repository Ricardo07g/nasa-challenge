# Ambiente local de desenvolvimento.
# Uso: cd projeto && docker compose up --build
#   Front: http://localhost:5173
#   API:   http://localhost:8000/docs
#   Banco: localhost:5433 (PostgreSQL + PostGIS)
# Os valores padrão do banco são só para uso local; para mudar, copie .env.example para .env.

services:
  db:
    # PostgreSQL 17 + PostGIS 3.5 (dados geográficos da NASA: pontos, grades, polígonos).
    # A imagem oficial só tem versão amd64; em Mac com chip Apple ela roda emulada.
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raiz_orbital}
      POSTGRES_USER: ${POSTGRES_USER:-raiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raiz_local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migration:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-raiz}:${POSTGRES_PASSWORD:-raiz_local}@db:5432/${POSTGRES_DB:-raiz_orbital}
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-raiz}:${POSTGRES_PASSWORD:-raiz_local}@db:5432/${POSTGRES_DB:-raiz_orbital}
      # Dados baixados pelos scripts de pipeline/ (pasta local data/baixados, fora do git; ver
      # backend/docs/como-preparar-os-dados-locais.md). Sem o arquivo, a API segue sem esse dado.
      CMIP6_PATH: ${CMIP6_PATH:-/dados_baixados/nasa_nex_gddp_cmip6/cmip6_deltas_nex_gddp.json}
      NDVI_CACHE_PATH: ${NDVI_CACHE_PATH:-/dados_baixados/nasa_modis_ndvi/ndvi_modis_appeears.json}
      NDVI_AREA_PATH: ${NDVI_AREA_PATH:-/dados_baixados/nasa_modis_ndvi_area/ndvi_modis_area.json}
      ONI_PATH: ${ONI_PATH:-/dados_baixados/noaa_oni/oni.json}
      REGIAO_PATH: ${REGIAO_PATH:-/dados_baixados/nasa_modis_ndvi_regiao/regiao_ndvi_modis.json}
      IMERG_LATE_PATH: ${IMERG_LATE_PATH:-/dados_baixados/nasa_gpm_imerg_late/chuva_30d_imerg_late.json}
      SMAP_PATH: ${SMAP_PATH:-/dados_baixados/nasa_smap/smap_semeadura.json}
      SMAP_RECENTE_PATH: ${SMAP_RECENTE_PATH:-/dados_baixados/nasa_smap/smap_recente.json}
      SOJA_RECENTE_PATH: ${SOJA_RECENTE_PATH:-/dados_baixados/nasa_modis_soja_recente/soja_recente_2026.json}
      ENSO_PREVISAO_PATH: ${ENSO_PREVISAO_PATH:-/dados_baixados/noaa_enso_previsao/enso_previsao.json}
      AREA_QUEIMADA_PATH: ${AREA_QUEIMADA_PATH:-/dados_baixados/nasa_modis_mcd64a1/area_queimada_mcd64a1.json}
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/pipeline:/app/pipeline
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
      - ../data/baixados:/dados_baixados:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      # http = API real (o backend deste compose); mock = dados de exemplo, sem backend.
      VITE_API_MODE: ${VITE_API_MODE:-http}
      # Link público do bot do Telegram (P5). Vazio = sem Telegram na interface.
      VITE_TELEGRAM_BOT_URL: ${VITE_TELEGRAM_BOT_URL:-}
      # Abre "Onde fica a lavoura" com a lavoura de demonstração marcada (pacote 2). false desliga.
      VITE_ABRIR_COM_DEMONSTRACAO: ${VITE_ABRIR_COM_DEMONSTRACAO:-true}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
